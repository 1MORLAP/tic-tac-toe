<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>
<style>
body { font-family: Arial; text-align: center; }
#board { display: grid; grid-template-columns: repeat(3, 100px); margin: 20px auto; }
.cell { width: 100px; height: 100px; border: 2px solid #333; font-size: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div id="board"></div>
<p id="status">Player X's turn</p>
<button onclick="resetGame()">Reset</button>

<script>
let board = Array(9).fill(null);
let currentPlayer = 'X';
let gameActive = true;

const winningConditions = [
  [0,1,2], [3,4,5], [6,7,8],
  [0,3,6], [1,4,7], [2,5,8],
  [0,4,8], [2,4,6]
];

function createBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.dataset.index = i;
    cell.addEventListener('click', handleCellClick);
    boardEl.appendChild(cell);
  }
}

function handleCellClick(e) {
  const index = parseInt(e.target.dataset.index);
  if (board[index] || !gameActive) return;
  board[index] = currentPlayer;
  e.target.textContent = currentPlayer;
  if (checkWin()) {
    document.getElementById('status').textContent = `Player ${currentPlayer} wins!`;
    gameActive = false;
    return;
  }
  if (board.every(cell => cell)) {
    document.getElementById('status').textContent = "It's a draw!";
    gameActive = false;
    return;
  }
  currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
  document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;
}

function checkWin() {
  return winningConditions.some(condition => {
    return condition.every(index => board[index] === currentPlayer);
  });
}

function resetGame() {
  board = Array(9).fill(null);
  currentPlayer = 'X';
  gameActive = true;
  document.getElementById('status').textContent = "Player X's turn";
  createBoard();
}

createBoard();
</script>
</body>
</html>
